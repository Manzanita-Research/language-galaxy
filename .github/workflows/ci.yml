name: CI

# One Cloudflare Worker serves everything. Pushes to main deploy the `prod`
# stage to language-galaxy.jem.computer. Each pull request deploys a
# `pr-<number>` stage, which uploads a version of that same Worker behind its
# own preview URL without taking production traffic; closing the pull request
# releases it. See alchemy.run.ts.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec oxfmt --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://language-galaxy.jem.computer
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_TRACK: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec alchemy deploy --stage prod --yes --no-input

  # Forks don't receive secrets, so only same-repo pull requests get previews.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_TRACK: 1
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: deploy
        run: |
          pnpm exec alchemy deploy --stage "$STAGE" --yes --no-input 2>&1 | tee deploy.log
          url=$(grep -oE "https://$STAGE-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev" deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  release-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_TRACK: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec alchemy destroy --stage "pr-${{ github.event.pull_request.number }}" --yes --no-input
