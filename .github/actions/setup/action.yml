name: Setup
description: Install pnpm, Node and the project's dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.22.0
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
